name: Build & auto-update images

on:
  schedule:
    - cron: "17 */6 * * *"        # version check every 6 hours; rebuilds only if something changed
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild even if nothing changed
        type: boolean
        default: false

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  # Docker build summary + a downloadable build record (open it in Docker Desktop) on every build
  DOCKER_BUILD_SUMMARY: true
  DOCKER_BUILD_RECORD_UPLOAD: true
  DOCKER_BUILD_RECORD_RETENTION_DAYS: 14

jobs:
  # ------------------------------------------------------------------
  # 1. Check: resolve the newest version of everything, say what changed
  #    since the last published image, and decide whether to build.
  #    Optional repo variables: UBUNTU_TRACK (latest|rolling), TDARR_VERSION,
  #    HANDBRAKE_VERSION, FFMPEG_ASSET
  # ------------------------------------------------------------------
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    outputs:
      repo: ${{ steps.v.outputs.repo }}
      ubuntu: ${{ steps.v.outputs.ubuntu }}
      udigest: ${{ steps.v.outputs.udigest }}
      tdarr: ${{ steps.v.outputs.tdarr }}
      handbrake: ${{ steps.v.outputs.handbrake }}
      ffmpeg_asset: ${{ steps.v.outputs.ffmpeg_asset }}
      ffmpeg_stamp: ${{ steps.v.outputs.ffmpeg_stamp }}
      hb_tag: ${{ steps.v.outputs.hb_tag }}
      fp: ${{ steps.v.outputs.fp }}
      build: ${{ steps.v.outputs.build }}
      reason: ${{ steps.v.outputs.reason }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve latest versions and decide
        id: v
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TRACK: ${{ vars.UBUNTU_TRACK || 'latest' }}
          PIN_TDARR: ${{ vars.TDARR_VERSION }}
          PIN_HB: ${{ vars.HANDBRAKE_VERSION }}
          FFMPEG_ASSET: ${{ vars.FFMPEG_ASSET || 'ffmpeg-master-latest' }}
          EVENT: ${{ github.event_name }}
          FORCE: ${{ inputs.force }}
        run: |
          set -Eeuo pipefail
          trap 'echo "::error title=Version check failed::line $LINENO: $BASH_COMMAND"' ERR
          log()   { echo "[$(date -u +%H:%M:%S)] $*"; }
          fetch() { curl -fsSL --retry 3 --retry-delay 2 --max-time 60 "$@"; }
          REPO="${GITHUB_REPOSITORY,,}"
          IMAGE="${REGISTRY}/${REPO}-media"

          # ---- Ubuntu ----
          echo "::group::Ubuntu (track: ${TRACK})"
          log "pulling ubuntu:${TRACK}"
          docker pull -q "ubuntu:${TRACK}" >/dev/null
          UBUNTU=$(docker run --rm "ubuntu:${TRACK}" sh -c '. /etc/os-release && echo "$VERSION_ID"')
          UDIGEST=$(docker buildx imagetools inspect "ubuntu:${UBUNTU}" --format '{{json .Manifest}}' | jq -r .digest)
          log "Ubuntu ${UBUNTU}, image digest ${UDIGEST}"
          echo "::endgroup::"

          # ---- Tdarr ----
          echo "::group::Tdarr"
          if [ -n "${PIN_TDARR}" ]; then
            TDARR="${PIN_TDARR}"; log "pinned via repo variable TDARR_VERSION"
          else
            log "reading Tdarr versions.json"
            RAW=$(fetch https://f000.backblazeb2.com/file/tdarrs/versions.json) || RAW=""
            TDARR=$(grep -oE 'versions/[0-9]+\.[0-9]+\.[0-9]+/' <<<"$RAW" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | sort -V | tail -1 || true)
            if [ -z "$TDARR" ]; then
              echo "::error title=Tdarr version lookup failed::Could not find a version in versions.json. Set the TDARR_VERSION repo variable to pin one."
              echo "--- first 600 bytes of response (empty means the download failed) ---"; head -c 600 <<<"$RAW"; echo
              exit 1
            fi
          fi
          log "Tdarr ${TDARR}"
          echo "::endgroup::"

          # ---- HandBrake ----
          echo "::group::HandBrake"
          if [ -n "${PIN_HB}" ]; then
            HB="${PIN_HB}"; log "pinned via repo variable HANDBRAKE_VERSION"
          else
            JSON=$(fetch -H "Authorization: Bearer $GH_TOKEN" https://api.github.com/repos/HandBrake/HandBrake/releases/latest) || JSON=""
            HB=$(jq -r '.tag_name // empty' <<<"$JSON" 2>/dev/null || true)
            if [ -z "$HB" ]; then
              echo "::error title=HandBrake version lookup failed::GitHub API returned no tag_name."
              echo "--- first 600 bytes of response ---"; head -c 600 <<<"$JSON"; echo
              exit 1
            fi
          fi
          log "HandBrake ${HB}"
          echo "::endgroup::"

          # ---- ffmpeg ----
          echo "::group::ffmpeg (${FFMPEG_ASSET})"
          JSON=$(fetch -H "Authorization: Bearer $GH_TOKEN" https://api.github.com/repos/BtbN/FFmpeg-Builds/releases/tags/latest) || JSON=""
          FFSTAMP=$(jq -r --arg n "${FFMPEG_ASSET}-linux64-gpl.tar.xz" '.assets[]? | select(.name==$n) | .updated_at' <<<"$JSON" 2>/dev/null || true)
          if [ -z "$FFSTAMP" ]; then
            echo "::error title=ffmpeg asset not found::${FFMPEG_ASSET}-linux64-gpl.tar.xz is not in BtbN's latest release."
            echo "--- linux64 gpl assets that do exist ---"
            jq -r '.assets[]?.name' <<<"$JSON" 2>/dev/null | grep -E 'linux64-gpl' | head -20 || true
            exit 1
          fi
          FFSTAMP="${FFSTAMP%%T*}"
          log "ffmpeg asset last republished ${FFSTAMP}"
          echo "::endgroup::"

          # ---- what is in the currently published image? (best effort) ----
          OLD=$(docker buildx imagetools inspect "${IMAGE}:latest" --format '{{json .Image}}' 2>/dev/null \
                | jq -c '(if type=="object" and has("config") then . else (.["linux/amd64"] // {}) end) | .config.Labels // {}' 2>/dev/null) || OLD='{}'
          [ -n "$OLD" ] || OLD='{}'
          old() { jq -r --arg k "$1" '.[$k] // ""' <<<"$OLD"; }

          # ---- fingerprint ----
          CFG=$(git ls-files Dockerfile docker patches | xargs sha256sum | sha256sum | cut -c1-12)
          HBCFG=$(git ls-files docker/handbrake.Dockerfile docker/run-logged.sh patches | xargs sha256sum | sha256sum | cut -c1-8)
          WEEK=$(date +%G-%V)
          FP=$(printf '%s|' "$UBUNTU" "$UDIGEST" "$TDARR" "$HB" "$FFSTAMP" "$CFG" "$WEEK" | sha256sum | cut -c1-16)
          HBTAG="${HB}-u${UBUNTU}-${HBCFG}"

          # ---- comparison table ----
          CHANGES=()
          row() {
            local n="$1" o="${2:-}" v="$3" s
            if [ -z "$o" ]; then s="🆕 no previous record"
            elif [ "$o" != "$v" ]; then s="⬆️ **updated**"; CHANGES+=("$n $o → $v")
            else s="✔️ same"; fi
            echo "| $n | ${o:-–} | $v | $s |"
          }
          {
            echo "## 🔎 Version check"
            echo "| Component | Published image | Latest | Status |"
            echo "|---|---|---|---|"
            row "Ubuntu" "$(old dev.media.ubuntu)" "$UBUNTU"
            row "Ubuntu image digest" "$(old dev.media.ubuntu-digest | cut -c1-19)" "${UDIGEST:0:19}"
            row "Tdarr" "$(old dev.media.tdarr)" "$TDARR"
            row "HandBrake" "$(old dev.media.handbrake)" "$HB"
            row "ffmpeg build date" "$(old dev.media.ffmpeg-stamp)" "$FFSTAMP"
          } >> "$GITHUB_STEP_SUMMARY"

          # ---- decision ----
          BUILD=true
          if [ "$EVENT" = pull_request ]; then
            REASON="pull request: build base/builder only, nothing is pushed"
          elif [ "${FORCE:-false}" = true ]; then
            REASON="manual run with force enabled"
          elif docker buildx imagetools inspect "${IMAGE}:fp-${FP}" >/dev/null 2>&1; then
            BUILD=false
            REASON="nothing changed since the last build (fingerprint fp-${FP})"
          elif [ "${#CHANGES[@]}" -gt 0 ]; then
            REASON="$(printf '%s; ' "${CHANGES[@]}")"
          elif [ -z "$(old dev.media.tdarr)" ]; then
            REASON="no previously published image found"
          else
            REASON="build files changed or weekly refresh (week ${WEEK}) to pick up apt security updates"
          fi
          REASON="${REASON%; }"

          {
            echo
            if [ "$BUILD" = true ]; then echo "**Decision: 🚀 build.** ${REASON}"
            else echo "**Decision: ⏭️ skip.** ${REASON}"; fi
            echo
            echo "Fingerprint \`${FP}\` · HandBrake artifact tag \`${HBTAG}\`"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=Update check::build=${BUILD}: ${REASON}"
          log "decision: build=${BUILD} (${REASON})"

          {
            echo "repo=$REPO"; echo "ubuntu=$UBUNTU"; echo "udigest=$UDIGEST"; echo "tdarr=$TDARR"
            echo "handbrake=$HB"; echo "ffmpeg_asset=$FFMPEG_ASSET"; echo "ffmpeg_stamp=$FFSTAMP"
            echo "hb_tag=$HBTAG"; echo "fp=$FP"; echo "build=$BUILD"; echo "reason=$REASON"
          } >> "$GITHUB_OUTPUT"

  # ------------------------------------------------------------------
  # 2. base + builder images (multi-arch)
  # ------------------------------------------------------------------
  base-builder:
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        target: [base, builder]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ needs.check.outputs.repo }}-${{ matrix.target }}
          tags: |
            type=raw,value=${{ needs.check.outputs.ubuntu }}
            type=raw,value=latest
            type=sha
      - name: Build and push ${{ matrix.target }} (amd64 + arm64)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: UBUNTU_VERSION=${{ needs.check.outputs.ubuntu }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
      - name: Attest build provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ needs.check.outputs.repo }}-${{ matrix.target }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Summary
        if: always()
        env:
          OUTCOME: ${{ steps.build.outcome }}
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo "### ${{ matrix.target }} image: ${OUTCOME}"
            echo "Ubuntu ${{ needs.check.outputs.ubuntu }} · digest \`${DIGEST:-n/a}\`"
            echo '```'; echo "${TAGS}"; echo '```'
            if [ "$OUTCOME" = failure ]; then
              echo "❌ Build failed. The error is at the bottom of the **Build and push** step log; the Docker Build Summary below has the failing command, and the \`.dockerbuild\` artifact can be opened in Docker Desktop."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # ------------------------------------------------------------------
  # 3. HandBrake: compiled here in CI and published as a scratch
  #    artifact image. Skipped if that exact version/config exists.
  # ------------------------------------------------------------------
  handbrake:
    needs: check
    if: needs.check.outputs.build == 'true' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
      packages: write
    env:
      ARTIFACT: ghcr.io/${{ needs.check.outputs.repo }}-handbrake:${{ needs.check.outputs.hb_tag }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Already built?
        id: exists
        run: |
          echo "[$(date -u +%T)] looking for ${ARTIFACT}"
          if docker buildx imagetools inspect "${ARTIFACT}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "[$(date -u +%T)] artifact already published, skipping the compile"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "[$(date -u +%T)] not found, HandBrake ${{ needs.check.outputs.handbrake }} will be compiled"
          fi

      - name: Free disk space (HandBrake contribs are large)
        if: steps.exists.outputs.exists != 'true'
        run: |
          echo "::group::disk before"; df -h /; echo "::endgroup::"
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          echo "::group::disk after cleanup"; df -h /; echo "::endgroup::"
          echo "HB_START=$(date +%s)" >> "$GITHUB_ENV"

      - name: Compile HandBrake ${{ needs.check.outputs.handbrake }} (5 timed phases, see log)
        id: compile
        if: steps.exists.outputs.exists != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/handbrake.Dockerfile
          target: artifact
          platforms: linux/amd64
          push: true
          tags: ${{ env.ARTIFACT }}
          build-args: |
            UBUNTU_VERSION=${{ needs.check.outputs.ubuntu }}
            HANDBRAKE_VERSION=${{ needs.check.outputs.handbrake }}
          cache-from: type=gha,scope=handbrake
          cache-to: type=gha,mode=max,scope=handbrake

      - name: Diagnostics on failure
        if: failure()
        run: |
          echo "::group::disk space (out-of-space is the most common HandBrake build failure)"; df -h; echo "::endgroup::"
          echo "::group::docker disk usage"; docker system df || true; echo "::endgroup::"
          echo "::group::buildx cache usage"; docker buildx du 2>/dev/null | tail -20 || true; echo "::endgroup::"
          echo "Where to look: open the 'Compile HandBrake' step. Phases are printed as '=== n/5 ... ==='."
          echo "A failure report ('FAILED ... last 120 lines ... lines that look like errors') is printed at the end of the failing phase."

      - name: Summary
        if: always()
        env:
          EXISTS: ${{ steps.exists.outputs.exists }}
          OUTCOME: ${{ steps.compile.outcome }}
          DIGEST: ${{ steps.compile.outputs.digest }}
        run: |
          {
            echo "### HandBrake ${{ needs.check.outputs.handbrake }}"
            if [ "$EXISTS" = true ]; then
              echo "⏭️ Skipped: \`${ARTIFACT}\` is already published."
            elif [ "$OUTCOME" = success ]; then
              echo "✅ Compiled in $(( ( $(date +%s) - ${HB_START:-$(date +%s)} ) / 60 )) min and published as \`${ARTIFACT}\`"
              echo "Digest: \`${DIGEST}\`"
            else
              echo "❌ Compile ${OUTCOME:-did not run} after $(( ( $(date +%s) - ${HB_START:-$(date +%s)} ) / 60 )) min. See the **Compile HandBrake** step: the failing phase prints its last 120 lines and error-looking lines at the end."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # ------------------------------------------------------------------
  # 4. media image: ffmpeg + HandBrake + Tdarr Node + GPU userspace
  # ------------------------------------------------------------------
  media:
    needs: [check, handbrake]
    if: needs.check.outputs.build == 'true' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      IMAGE: ghcr.io/${{ needs.check.outputs.repo }}-media
      BUILD_ARGS: |
        UBUNTU_VERSION=${{ needs.check.outputs.ubuntu }}
        UBUNTU_DIGEST=${{ needs.check.outputs.udigest }}
        TDARR_VERSION=${{ needs.check.outputs.tdarr }}
        HANDBRAKE_VERSION=${{ needs.check.outputs.handbrake }}
        HANDBRAKE_IMAGE=ghcr.io/${{ needs.check.outputs.repo }}-handbrake:${{ needs.check.outputs.hb_tag }}
        FFMPEG_ASSET=${{ needs.check.outputs.ffmpeg_asset }}
        FFMPEG_STAMP=${{ needs.check.outputs.ffmpeg_stamp }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build plan
        run: |
          echo "Reason for this build: ${{ needs.check.outputs.reason }}"
          echo "::group::build arguments"; echo "$BUILD_ARGS"; echo "::endgroup::"

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=raw,value=ubuntu-${{ needs.check.outputs.ubuntu }}
            type=raw,value=tdarr-${{ needs.check.outputs.tdarr }}
            type=raw,value=hb-${{ needs.check.outputs.handbrake }}
            type=raw,value=fp-${{ needs.check.outputs.fp }}
            type=sha

      - name: Build media image (local, for smoke test)
        id: local
        uses: docker/build-push-action@v6
        with:
          context: .
          target: media
          platforms: linux/amd64
          load: true
          tags: media:test
          build-args: ${{ env.BUILD_ARGS }}
          cache-from: type=gha,scope=media
          cache-to: type=gha,mode=max,scope=media

      - name: Smoke test
        id: smoke
        run: |
          set -uo pipefail
          S="$GITHUB_STEP_SUMMARY"
          echo "IMG_MB=$(( $(docker image inspect media:test --format '{{.Size}}') / 1048576 ))" >> "$GITHUB_ENV"
          { echo "### 🧪 Smoke test"; echo "| Check | Result |"; echo "|---|---|"; } >> "$S"
          fails=0
          inimg() { docker run --rm --entrypoint sh media:test -c "$1"; }
          check() {   # check "<name>" "<sh script run inside the image>"
            local name="$1" out
            echo "::group::$name"
            if out=$(inimg "$2" 2>&1); then
              echo "$out"; echo "::endgroup::"; echo "| $name | ✅ |" >> "$S"
            else
              echo "$out"; echo "::endgroup::"
              echo "::error title=Smoke test failed::$name"
              echo "| $name | ❌ |" >> "$S"; fails=$((fails+1))
            fi
          }
          check "ffmpeg runs" 'ffmpeg -hide_banner -version | head -1'
          check "HandBrakeCLI runs" 'HandBrakeCLI --version 2>&1 | head -3'
          check "ffmpeg has NVENC, QSV and VAAPI encoders" \
            'enc=$(ffmpeg -hide_banner -encoders); for e in h264_nvenc hevc_nvenc h264_qsv hevc_qsv h264_vaapi hevc_vaapi; do echo "$enc" | grep -q " $e " && echo "found $e" || { echo "MISSING $e"; exit 1; }; done'
          check "HandBrakeCLI libraries all resolve" \
            'out=$(ldd "$(command -v HandBrakeCLI)"); if echo "$out" | grep "not found"; then exit 1; fi; echo "$out" | wc -l | xargs echo libraries resolved:'
          check "Tdarr Node present" 'test -x /opt/tdarr/node/Tdarr_Node && echo "Tdarr Node $(cat /opt/tdarr/VERSION)"'
          check "helper tools present" 'for t in vainfo mkvpropedit mediainfo jq; do command -v $t || { echo "missing $t"; exit 1; }; done'
          check "ffmpeg hwaccels (informational)" 'ffmpeg -hide_banner -hwaccels'
          [ "$fails" -eq 0 ]

      - name: Push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          target: media
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ env.BUILD_ARGS }}
          cache-from: type=gha,scope=media

      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Diagnostics on failure
        if: failure()
        run: |
          echo "::group::disk"; df -h /; echo "::endgroup::"
          echo "::group::docker images"; docker images; echo "::endgroup::"
          if docker image inspect media:test >/dev/null 2>&1; then
            echo "::group::ffmpeg build configuration"
            docker run --rm --entrypoint ffmpeg media:test -hide_banner -buildconf | head -60 || true
            echo "::endgroup::"
            echo "::group::GPU-related packages installed in the image"
            docker run --rm --entrypoint sh media:test -c "dpkg -l | grep -Ei 'libva|vpl|mfx|vulkan|opencl|mesa|igdgmm|intel-media'" || true
            echo "::endgroup::"
            echo "::group::runtime packages HandBrake needed"
            docker run --rm --entrypoint sh media:test -c "ldd \$(command -v HandBrakeCLI)" || true
            echo "::endgroup::"
          else
            echo "media:test was not built, so the failure is in the image build step above."
          fi

      - name: Summary
        if: always()
        env:
          OUTCOME: ${{ steps.push.outcome }}
          DIGEST: ${{ steps.push.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo "### media image"
            if [ "$OUTCOME" = success ]; then
              echo "✅ Published \`${IMAGE}\` (${IMG_MB:-?} MB) · digest \`${DIGEST}\`"
              echo "Ubuntu ${{ needs.check.outputs.ubuntu }} · Tdarr ${{ needs.check.outputs.tdarr }} · HandBrake ${{ needs.check.outputs.handbrake }} · ffmpeg ${{ needs.check.outputs.ffmpeg_stamp }}"
              echo '```'; echo "${TAGS}"; echo '```'
            else
              echo "❌ Not published. Check the failed step: *Build media image* (apt/copy errors), *Smoke test* (table above), or *Push*. Diagnostics are printed in the *Diagnostics on failure* step."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # ------------------------------------------------------------------
  # 5. Example app on top of the fresh base/builder images
  # ------------------------------------------------------------------
  example-app:
    needs: [check, base-builder]
    if: needs.check.outputs.build == 'true' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: examples/hello-c
          load: true
          push: true
          tags: ${{ env.REGISTRY }}/${{ needs.check.outputs.repo }}-hello:latest
          build-args: |
            BUILDER_IMAGE=${{ env.REGISTRY }}/${{ needs.check.outputs.repo }}-builder:latest
            BASE_IMAGE=${{ env.REGISTRY }}/${{ needs.check.outputs.repo }}-base:latest
      - run: docker run --rm ${{ env.REGISTRY }}/${{ needs.check.outputs.repo }}-hello:latest

  # ------------------------------------------------------------------
  # 6. Run overview. On a failed scheduled run, also opens one issue
  #    that names the failed job/step and links to it.
  # ------------------------------------------------------------------
  report:
    needs: [check, base-builder, handbrake, media, example-app]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      actions: read
    steps:
      - name: Overview
        env:
          NEEDS: ${{ toJSON(needs) }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT: ${{ github.event_name }}
          REASON: ${{ needs.check.outputs.reason }}
        run: |
          icon() { case "$1" in success) echo "✅";; failure) echo "❌";; skipped) echo "⏭️";; cancelled) echo "🚫";; *) echo "❔";; esac; }
          {
            echo "## 📋 Run overview"
            echo "Trigger: \`${EVENT}\` · ${REASON}"
            echo
            echo "| Job | Result |"
            echo "|---|---|"
            jq -r 'to_entries[] | "\(.key) \(.value.result)"' <<<"$NEEDS" | while read -r j r; do echo "| $j | $(icon "$r") $r |"; done
            echo
            echo "| Component | Version |"
            echo "|---|---|"
            echo "| Ubuntu | ${{ needs.check.outputs.ubuntu }} |"
            echo "| Tdarr | ${{ needs.check.outputs.tdarr }} |"
            echo "| HandBrake | ${{ needs.check.outputs.handbrake }} |"
            echo "| ffmpeg | ${{ needs.check.outputs.ffmpeg_asset }} (${{ needs.check.outputs.ffmpeg_stamp }}) |"
            echo
            echo "Tip: use **Show timestamps** in the log viewer menu, or re-run with *Enable debug logging* for extra detail."
          } >> "$GITHUB_STEP_SUMMARY"

          if jq -e 'to_entries | map(.value.result) | index("failure")' <<<"$NEEDS" >/dev/null; then
            FAILED=$(gh run view "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --json jobs \
              --jq '.jobs[] | select(.conclusion=="failure") | "- **\(.name)**, failed step: \(first(.steps[] | select(.conclusion=="failure") | .name)) (\(.url))"' 2>/dev/null || true)
            echo "::error title=Build failed::${FAILED:-see the failed jobs above}"
            if [ "$EVENT" = schedule ] && [ -z "$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search 'Auto-update build failed in:title' --json number -q '.[0].number')" ]; then
              gh issue create --repo "$GITHUB_REPOSITORY" --title "Auto-update build failed" \
                --body "A scheduled update failed.

          ${FAILED}

          Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          Why it ran: ${REASON}"
            fi
          fi
